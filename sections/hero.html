<section class="min-h-screen flex items-center relative pt-20 overflow-hidden">
    <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center w-full z-10">
        <!-- Text Content -->
        <div class="text-center md:text-left order-2 md:order-1 relative z-20">
            <p class="text-cyber-green font-fira mb-4 text-xs md:text-sm tracking-[0.2em] uppercase"
                data-key="hero_greeting">System Online // Identity Verified</p>
            <h1 class="text-5xl md:text-7xl font-orbitron font-black text-white mb-6 leading-none gs-reveal">
                HAKIM <br>
                <span
                    class="text-transparent bg-clip-text bg-gradient-to-r from-cyber-blue to-cyber-purple drop-shadow-[0_0_10px_rgba(0,243,255,0.3)]">ALQUBATI</span>
            </h1>

            <div class="mb-8 pl-4 border-l-2 border-cyber-blue/30 mx-auto md:mx-0 max-w-md md:max-w-none text-left">
                <div class="text-xl md:text-2xl font-fira text-gray-300 flex items-center gap-3">
                    <span class="text-cyber-purple">></span>
                    <span id="typewriter" class="text-white font-semibold"></span>
                    <span class="blink text-cyber-green text-2xl">|</span>
                </div>
            </div>

            <div class="flex flex-col md:flex-row justify-center md:justify-start gap-5 mt-10">
                <a href="#projects"
                    class="group relative px-8 py-3 bg-cyber-blue/5 overflow-hidden rounded border border-cyber-blue/30 text-cyber-blue font-fira tracking-wider hover:text-black transition-all duration-300"
                    data-key="btn_projects">
                    <div
                        class="absolute inset-0 w-0 bg-cyber-blue transition-all duration-[250ms] ease-out group-hover:w-full">
                    </div>
                    <span class="relative">View Protocol_</span>
                </a>
                <a href="#contact"
                    class="group px-8 py-3 bg-transparent border border-white/10 text-gray-300 font-fira tracking-wider hover:border-cyber-purple hover:text-cyber-purple transition-all duration-300 rounded"
                    data-key="btn_contact">
                    <span class="relative">Initiate Uplink</span>
                </a>
            </div>
        </div>

        <!-- Professional Tech Frame Image -->
        <div class="flex justify-center md:justify-end order-1 md:order-2 gs-reveal relative z-10 md:pr-10">
            <div class="relative w-72 h-72 md:w-[30rem] md:h-[30rem] flex justify-center items-center group">
                <!-- Ambient Backdrop Glow -->
                <div
                    class="absolute inset-0 bg-cyber-blue/10 blur-[80px] rounded-full group-hover:bg-cyber-purple/10 transition-colors duration-1000">
                </div>

                <!-- Animated Geometric Elements (Subtle) -->
                <div
                    class="absolute inset-0 border border-white/5 rounded-[40px] rotate-3 scale-105 group-hover:rotate-6 group-hover:scale-110 transition-all duration-700 ease-out">
                </div>
                <div
                    class="absolute inset-0 border border-white/5 rounded-[40px] -rotate-3 scale-105 group-hover:-rotate-6 group-hover:scale-110 transition-all duration-700 ease-out">
                </div>

                <!-- Main Image Container -->
                <div
                    class="relative w-full h-full rounded-[30px] overflow-hidden border border-white/10 shadow-2xl bg-gray-900/50 backdrop-blur-sm">
                    <!-- Tech Overlay Scanline -->
                    <div
                        class="absolute inset-0 bg-gradient-to-b from-transparent via-cyber-blue/5 to-transparent bg-[length:100%_4px] opacity-20 pointer-events-none z-20">
                    </div>

                    <!-- Image -->
                    <img src="imgs/hakim-1.png" alt="Hakim Alqubati"
                        class="w-full h-full object-cover object-top filter contrast-[1.1] brightness-[1.1] sepia-[0.1] group-hover:sepia-0 transition-all duration-700">

                    <!-- Inner Tech UI Overlay -->
                    <div
                        class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/90 via-black/50 to-transparent z-30">
                        <div class="flex justify-between items-end border-b border-white/10 pb-3">
                            <div>
                                <div class="text-[10px] font-fira text-cyber-blue/80 tracking-[0.2em] mb-1">DESIGNATION
                                </div>
                                <div class="text-sm font-orbitron text-white">SR. ARCHITECT</div>
                            </div>
                            <div class="flex flex-col items-end">
                                <div class="flex gap-1 mb-1">
                                    <div class="w-1 h-1 bg-cyber-blue rounded-full"></div>
                                    <div class="w-1 h-1 bg-cyber-blue rounded-full opacity-50"></div>
                                    <div class="w-1 h-1 bg-cyber-blue rounded-full opacity-25"></div>
                                </div>
                                <div class="text-[10px] font-fira text-green-500 tracking-widest animate-pulse">ONLINE
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- External Tech Accents (Corners) -->
                <div
                    class="absolute -top-3 -left-3 w-16 h-16 border-t-2 border-l-2 border-cyber-blue/40 rounded-tl-xl z-20 transition-all duration-500 group-hover:border-cyber-blue group-hover:-top-4 group-hover:-left-4">
                </div>
                <div
                    class="absolute -bottom-3 -right-3 w-16 h-16 border-b-2 border-r-2 border-cyber-purple/40 rounded-br-xl z-20 transition-all duration-500 group-hover:border-cyber-purple group-hover:-bottom-4 group-hover:-right-4">
                </div>
            </div>
        </div>
    </div>

    <!-- Scroll Indicator -->
    <div
        class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-2 opacity-50 hover:opacity-100 transition-opacity cursor-pointer">
        <span class="text-[10px] font-fira tracking-widest text-cyber-blue">SCROLL</span>
        <div class="w-[1px] h-12 bg-gradient-to-b from-cyber-blue to-transparent"></div>
    </div>
</section>
