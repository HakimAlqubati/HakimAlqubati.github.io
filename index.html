<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakim Qubati | Backend Architect</title>
    
    <!-- Google Fonts: Inter for UI, JetBrains Mono for code look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Reset & Core Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Dark Slate */
            color: #e2e8f0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevents scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Background Gradient */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(29, 78, 216, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            top: -25%;
            left: -25%;
            z-index: 0;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Main Card Container */
        .profile-card {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.7); /* Semi-transparent dark */
            backdrop-filter: blur(12px); /* Glass effect */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            text-align: center;
            max-width: 550px; /* Slightly wider for 4 buttons */
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8; /* Sky Blue */
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        p.bio {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Buttons Container */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 columns */
            gap: 15px;
            justify-content: center;
        }

        /* Button Base Styles */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        /* WhatsApp */
        .btn-whatsapp {
            background-color: rgba(37, 211, 102, 0.1);
            color: #25D366;
            border: 1px solid rgba(37, 211, 102, 0.2);
        }
        .btn-whatsapp:hover {
            background-color: #25D366;
            color: #0f172a;
            transform: translateY(-3px);
        }

        /* Email */
        .btn-email {
            background-color: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .btn-email:hover {
            background-color: #f87171;
            color: #0f172a;
            transform: translateY(-3px);
        }

        /* LinkedIn */
        .btn-linkedin {
            background-color: rgba(10, 102, 194, 0.1);
            color: #0A66C2;
            border: 1px solid rgba(10, 102, 194, 0.2);
        }
        .btn-linkedin:hover {
            background-color: #0A66C2;
            color: #ffffff;
            transform: translateY(-3px);
        }

        /* Facebook */
        .btn-facebook {
            background-color: rgba(24, 119, 242, 0.1);
            color: #1877F2;
            border: 1px solid rgba(24, 119, 242, 0.2);
        }
        .btn-facebook:hover {
            background-color: #1877F2;
            color: #ffffff;
            transform: translateY(-3px);
        }

        /* Tech Stack Dots (Decoration) */
        .tech-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 2rem;
            opacity: 0.5;
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: #475569;
            border-radius: 50%;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .actions {
                grid-template-columns: 1fr; /* Stack buttons on very small screens */
            }
            h1 { font-size: 2rem; }
            .profile-card { padding: 2rem 1.5rem; }
        }

    </style>
</head>
<body>

    <div class="profile-card">
        
        <h1>Hakim Qubati</h1>
        
        <div class="role-badge">
            &lt;Backend Architect /&gt;
        </div>

        <p class="bio">
            Specialized in building scalable SaaS solutions, database analysis, and robust infrastructure using Laravel & FilamentPHP.
        </p>

        <div class="actions">
            <!-- WhatsApp -->
            <a href="https://wa.me/967773030069" target="_blank" class="btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>

            <!-- Email -->
            <a href="mailto:hakimahmed123321@gmail.com" class="btn btn-email">
                <i class="fas fa-envelope"></i> Email
            </a>

            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/hakim-ahmed-165106214/" target="_blank" class="btn btn-linkedin">
                <i class="fab fa-linkedin-in"></i> LinkedIn
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/alqubatiabdulhakim" target="_blank" class="btn btn-facebook">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
        </div>

        <!-- Decorative dots representing code lines -->
        <div class="tech-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
