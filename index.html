<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdulhakim Alqubati | System Architect & Backend Web Developer</title>
    <meta name="description"
        content="Portfolio of Abdulhakim Ahmed Fadl Qaid (Hakim Alqubati) — System Architect & Backend Web Developer specializing in Laravel, FilamentPHP, SaaS, ERP Systems, and Relational Database Architecture.">

    <!-- Fonts: Cairo for Arabic, Fira Code for Tech, Orbitron for Headings, Inter for Body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@400;500;600&family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#050505',
                            dark: '#0a0a12',
                            blue: '#00f3ff',
                            purple: '#bd00ff',
                            green: '#00ff41',
                            amber: '#f59e0b',
                            glass: 'rgba(20, 20, 30, 0.6)'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        fira: ['Fira Code', 'monospace'],
                        cairo: ['Cairo', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #050505;
        }

        ::-webkit-scrollbar-thumb {
            background: #00f3ff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bd00ff;
        }

        body {
            background-color: #050505;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* Neon Glow Effects */
        .text-glow-blue {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
        }

        .text-glow-purple {
            text-shadow: 0 0 10px rgba(189, 0, 255, 0.7);
        }

        .box-glow {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(15, 15, 25, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(0, 243, 255, 0.45);
            box-shadow: 0 8px 30px rgba(0, 243, 255, 0.12);
            transform: translateY(-4px);
        }

        /* Tech Tag Pill */
        .tech-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s ease;
        }

        .tech-pill:hover {
            border-color: #00f3ff;
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.08);
            transform: translateY(-1px);
        }

        /* Terminal Cursor Blink */
        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }

        /* Canvas for Three.js */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.55;
            pointer-events: none;
        }

        /* RTL & LTR Font Support */
        body[dir="rtl"] {
            font-family: 'Cairo', sans-serif;
        }

        body[dir="rtl"] .font-orbitron {
            font-family: 'Cairo', 'Orbitron', sans-serif;
            letter-spacing: 0 !important;
        }

        body[dir="ltr"] {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="antialiased selection:bg-cyber-blue selection:text-black" dir="ltr">

    <!-- Three.js Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Sections Containers -->
    <div id="header-container"></div>
    <main>
        <div id="hero-container"></div>
        <div id="about-container"></div>
        <div id="skills-container"></div>
        <div id="experience-container"></div>
        <div id="projects-container"></div>
        <div id="contact-container"></div>
    </main>
    <div id="footer-container"></div>

    <!-- Libraries: Three.js & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Main Logic -->
    <script src="js/main.js"></script>

    <script>
        // Dynamic Section Loader
        async function loadSection(id, file) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const html = await response.text();
                document.getElementById(id).innerHTML = html;
            } catch (e) {
                console.error(`Failed to load section ${file}:`, e);
                document.getElementById(id).innerHTML = `<div class="text-red-500 p-4">Error loading section: ${file}</div>`;
            }
        }

        async function loadAllSections() {
            await Promise.all([
                loadSection('header-container', 'sections/header.html'),
                loadSection('hero-container', 'sections/hero.html'),
                loadSection('about-container', 'sections/about.html'),
                loadSection('skills-container', 'sections/skills.html'),
                loadSection('experience-container', 'sections/experience.html'),
                loadSection('projects-container', 'sections/projects.html'),
                loadSection('contact-container', 'sections/contact.html'),
                loadSection('footer-container', 'sections/footer.html')
            ]);

            if (typeof initAll === 'function') {
                initAll();
            } else {
                console.error("initAll function not found in main.js");
            }
        }

        document.addEventListener('DOMContentLoaded', loadAllSections);
    </script>
</body>

</html>
