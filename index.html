<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdulhakim Alqubati | System Architect & Backend Web Developer</title>
    <meta name="description"
        content="Portfolio of Abdulhakim Ahmed Fadl Qaid (Hakim Alqubati) — System Architect & Backend Web Developer specializing in Laravel, FilamentPHP, SaaS, ERP Systems, and Relational Database Architecture.">

    <!-- Fonts: Plus Jakarta Sans & Inter for English, Cairo for Arabic, JetBrains Mono & Fira Code for Technical Metadata -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config: Enterprise Dark Minimalist Palette (60-30-10 Rule) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        /* 60% Base Surfaces, 30% Slate Neutrals, 10% Controlled Blue/Indigo Accents */
                        enterprise: {
                            canvas: '#090D16',
                            surface: '#0F1623',
                            elevated: '#151E2E',
                            border: '#1E293B',
                            accent: '#3B82F6',
                            accentLight: '#60A5FA',
                            indigo: '#6366F1',
                            emerald: '#10B981'
                        },
                        /* Legacy token mapping for seamless compatibility */
                        cyber: {
                            black: '#090D16',
                            dark: '#0F1623',
                            blue: '#3B82F6',
                            purple: '#6366F1',
                            green: '#10B981',
                            amber: '#64748B',
                            glass: 'rgba(15, 22, 35, 0.75)'
                        }
                    },
                    fontFamily: {
                        /* Mapped to clean geometric enterprise sans-serif instead of sci-fi Orbitron */
                        orbitron: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        fira: ['Fira Code', 'monospace'],
                        cairo: ['Cairo', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Minimalist Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #090D16;
        }

        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 4px;
            border: 2px solid #090D16;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3B82F6;
        }

        body {
            background-color: #090D16;
            color: #CBD5E1;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 55%),
                radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 45%);
        }

        /* Subtle Architectural Grid Overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000 30%, transparent 100%);
            pointer-events: none;
            z-index: -1;
        }

        /* Enterprise Dark Minimalist Surface Card */
        .glass-card {
            background: linear-gradient(180deg, rgba(21, 30, 46, 0.72) 0%, rgba(15, 22, 35, 0.82) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.12);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.04), 0 4px 20px -2px rgba(0, 0, 0, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.35);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 12px 32px -4px rgba(0, 0, 0, 0.5), 0 0 24px -6px rgba(59, 130, 246, 0.12);
            transform: translateY(-2px);
        }

        /* Minimalist Tech Tag Pill */
        .tech-pill {
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.14);
            color: #CBD5E1;
            transition: all 0.2s ease;
        }

        .tech-pill:hover {
            border-color: rgba(59, 130, 246, 0.45);
            color: #60A5FA;
            background: rgba(59, 130, 246, 0.08);
            transform: translateY(-1px);
        }

        /* Cursor Blink */
        .blink {
            animation: blinker 1.1s step-end infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }

        /* Canvas for Three.js (Subtle Ambient Background) */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
        }

        /* RTL & LTR Font Support */
        body[dir="rtl"] {
            font-family: 'Cairo', sans-serif;
        }

        body[dir="rtl"] .font-orbitron,
        body[dir="rtl"] .font-display {
            font-family: 'Cairo', sans-serif;
            letter-spacing: 0 !important;
        }

        body[dir="ltr"] {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="antialiased selection:bg-blue-500 selection:text-white" dir="ltr">

    <!-- Subtle Ambient Three.js Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Sections Containers -->
    <div id="header-container"></div>
    <main>
        <div id="hero-container"></div>
        <div id="about-container"></div>
        <div id="skills-container"></div>
        <div id="experience-container"></div>
        <div id="projects-container"></div>
        <div id="contact-container"></div>
    </main>
    <div id="footer-container"></div>

    <!-- Libraries: Three.js & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Main Logic -->
    <script src="js/main.js"></script>

    <script>
        // Dynamic Section Loader
        async function loadSection(id, file) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const html = await response.text();
                document.getElementById(id).innerHTML = html;
            } catch (e) {
                console.error(`Failed to load section ${file}:`, e);
                document.getElementById(id).innerHTML = `<div class="text-red-400 p-4">Error loading section: ${file}</div>`;
            }
        }

        async function loadAllSections() {
            await Promise.all([
                loadSection('header-container', 'sections/header.html'),
                loadSection('hero-container', 'sections/hero.html'),
                loadSection('about-container', 'sections/about.html'),
                loadSection('skills-container', 'sections/skills.html'),
                loadSection('experience-container', 'sections/experience.html'),
                loadSection('projects-container', 'sections/projects.html'),
                loadSection('contact-container', 'sections/contact.html'),
                loadSection('footer-container', 'sections/footer.html')
            ]);

            if (typeof initAll === 'function') {
                initAll();
            } else {
                console.error("initAll function not found in main.js");
            }
        }

        document.addEventListener('DOMContentLoaded', loadAllSections);
    </script>
</body>

</html>
